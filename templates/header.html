<header class="site-header" id="site-header">
  <!-- Верхняя полоска с контактами -->
  <div class="header-top">
    <div class="container header-top-inner">
      <div class="header-contacts-top">
        <a href="" class="header-phone" id="header-phone" aria-label="Позвонить">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07
                     19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67
                     A2 2 0 014.11 2h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81
                     a2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27
                     a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z"/>
          </svg>
          <span id="header-phone-text"></span>
        </a>
        <a href="" class="header-email" id="header-email" aria-label="Написать на почту">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <rect x="2" y="4" width="20" height="16" rx="2"/>
            <polyline points="22,4 12,13 2,4"/>
          </svg>
          <span id="header-email-text"></span>
        </a>
      </div>
      <div class="header-messengers" id="header-messengers"></div>
    </div>
  </div>

  <!-- Основная шапка -->
  <div class="header-main">
    <div class="container header-main-inner">
      <a href="index.html" class="logo" aria-label="На главную — СольОпт">
        <img src="assets/logo/logo.svg"
             alt="СольОпт — оптовая продажа таблетированной соли"
             id="header-logo" width="180" height="50">
      </a>

      <nav class="main-nav" id="main-nav" aria-label="Основная навигация">
        <ul class="nav-list">
          <li><a href="index.html" class="nav-link">Главная</a></li>
          <li><a href="catalog.html" class="nav-link">Каталог</a></li>
          <li><a href="certificates.html" class="nav-link">Сертификаты</a></li>
          <li><a href="contacts.html" class="nav-link">Контакты</a></li>
        </ul>
      </nav>

      <div class="header-actions">
        <a href="" class="header-action-phone" id="header-action-phone" aria-label="Позвонить">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07
                     19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67
                     A2 2 0 014.11 2h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81
                     a2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27
                     a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z"/>
          </svg>
        </a>
        <button class="btn btn-primary btn-price" id="btn-get-price"
                aria-label="Получить прайс-лист">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2">
            <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/>
            <polyline points="14 2 14 8 20 8"/>
          </svg>
          <span class="btn-price-label">Получить прайс</span>
        </button>
      </div>

      <!-- БУРГЕР КНОПКА -->
      <button class="burger-btn" id="burger-btn"
              aria-label="Открыть меню" aria-expanded="false"
              aria-controls="mobile-menu">
        <span class="burger-icon" aria-hidden="true">
          <span class="burger-line burger-line--top"></span>
          <span class="burger-line burger-line--mid"></span>
          <span class="burger-line burger-line--bot"></span>
        </span>
      </button>
    </div>
  </div>

  <!-- МОБИЛЬНОЕ МЕНЮ -->
  <div class="mobile-menu" id="mobile-menu" aria-hidden="true" role="dialog"
       aria-label="Мобильная навигация">
    <div class="mobile-menu-overlay" id="mobile-menu-overlay"></div>
    <div class="mobile-menu-panel">
      <div class="mobile-menu-header">
        <a href="index.html" class="mobile-menu-logo" aria-label="На главную">
          <img src="assets/logo/logo.svg" alt="СольОпт" width="140" height="38">
        </a>
        <button class="mobile-menu-close" id="mobile-menu-close" aria-label="Закрыть меню">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>

      <nav class="mobile-nav" aria-label="Мобильная навигация">
        <ul class="mobile-nav-list">
          <li><a href="index.html" class="mobile-nav-link" data-page="index.html">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>
              <polyline points="9 22 9 12 15 12 15 22"/>
            </svg>Главная</a></li>
          <li><a href="catalog.html" class="mobile-nav-link" data-page="catalog.html">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <rect x="3" y="3" width="7" height="7"/>
              <rect x="14" y="3" width="7" height="7"/>
              <rect x="3" y="14" width="7" height="7"/>
              <rect x="14" y="14" width="7" height="7"/>
            </svg>Каталог</a></li>
          <li><a href="certificates.html" class="mobile-nav-link" data-page="certificates.html">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/>
              <polyline points="14 2 14 8 20 8"/>
              <line x1="16" y1="13" x2="8" y2="13"/>
              <line x1="16" y1="17" x2="8" y2="17"/>
            </svg>Сертификаты</a></li>
          <li><a href="contacts.html" class="mobile-nav-link" data-page="contacts.html">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/>
              <circle cx="12" cy="10" r="3"/>
            </svg>Контакты</a></li>
        </ul>
      </nav>

      <div class="mobile-menu-divider"></div>

      <div class="mobile-menu-contacts">
        <a href="" class="mobile-contact-item" id="mobile-phone">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07
                     19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67
                     A2 2 0 014.11 2h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81
                     a2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27
                     a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z"/>
          </svg>
          <span id="mobile-phone-text"></span>
        </a>
        <a href="" class="mobile-contact-item" id="mobile-email">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <rect x="2" y="4" width="20" height="16" rx="2"/>
            <polyline points="22,4 12,13 2,4"/>
          </svg>
          <span id="mobile-email-text"></span>
        </a>
      </div>

      <div class="mobile-messengers" id="mobile-messengers"></div>

      <button class="btn btn-primary btn-block mobile-price-btn" id="btn-get-price-mobile">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2">
          <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
        </svg>
        Получить прайс-лист
      </button>

      <div class="mobile-menu-hours" id="mobile-hours"></div>
    </div>
  </div>

  <!-- Нижняя мобильная панель навигации -->
  <div class="mobile-bottom-bar" id="mobile-bottom-bar">
    <a href="index.html" class="bottom-bar-item" data-page="index.html">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>
        <polyline points="9 22 9 12 15 12 15 22"/>
      </svg><span>Главная</span>
    </a>
    <a href="catalog.html" class="bottom-bar-item" data-page="catalog.html">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <rect x="3" y="3" width="7" height="7"/>
        <rect x="14" y="3" width="7" height="7"/>
        <rect x="3" y="14" width="7" height="7"/>
        <rect x="14" y="14" width="7" height="7"/>
      </svg><span>Каталог</span>
    </a>
    <a href="" class="bottom-bar-item bottom-bar-phone" id="bottom-bar-phone">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07
                 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3
                 a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11

                 c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z"/>
      </svg><span>Звонок</span>
    </a>
    <a href="contacts.html" class="bottom-bar-item" data-page="contacts.html">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/>
        <circle cx="12" cy="10" r="3"/>
      </svg><span>Контакты</span>

    <button class="bottom-bar-item bottom-bar-menu" id="bottom-bar-menu-btn">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <line x1="3" y1="6" x2="21" y2="6"/>
        <line x1="3" y1="12" x2="21" y2="12"/>
        <line x1="3" y1="18" x2="21" y2="18"/>
